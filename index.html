<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta Northern Blade | SLAX</title>
    <style>
        /* نظام الألوان والمتغيرات */
        :root {
            --red: #ff0000;
            --dark-red: #8b0000;
            --glass: rgba(10, 10, 10, 0.85);
            --border: rgba(255, 0, 0, 0.3);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            margin: 0; 
            background: #000; 
            color: white;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            height: 100vh; 
            overflow: hidden;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        /* خلفية الفيديو */
        .video-container { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: -2; 
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.4) contrast(1.2); 
        }

        .overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%); 
            z-index: -1; 
        }

        /* زر التحكم بالصوت */
        .audio-toggle {
            position: fixed; 
            top: 25px; 
            right: 25px;
            width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            z-index: 100; 
            transition: 0.3s;
        }

        .audio-toggle:active { transform: scale(0.9); }

        .speaker-box {
            width: 20px; height: 15px; 
            display: flex; 
            align-items: center; 
            position: relative;
        }

        .speaker-body { width: 6px; height: 7px; background: white; position: relative; z-index: 2; }
        .speaker-head { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 11px solid white; margin-left: -1px; }
        .mute-line { position: absolute; width: 25px; height: 2px; background: var(--red); transform: rotate(45deg); z-index: 10; border-radius: 2px; transition: 0.2s; }

        /* الكارد الزجاجي */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 35px; 
            padding: 40px 25px;
            width: 90%; 
            max-width: 380px; 
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .title {
            font-size: 3.5rem; 
            font-weight: 900; 
            margin: 0;
            background: linear-gradient(180deg, #fff 30%, var(--red) 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .status-badge {
            display: inline-flex; 
            align-items: center;
            background: rgba(0, 255, 100, 0.05);
            color: #00ff64; 
            padding: 6px 14px;
            border-radius: 50px; 
            font-size: 0.75rem; 
            font-weight: bold;
            margin: 15px 0 25px 0; 
            border: 1px solid rgba(0, 255, 100, 0.2);
        }

        .dot { 
            height: 7px; width: 7px; 
            background: #00ff64; 
            border-radius: 50%; 
            margin-left: 8px; 
            box-shadow: 0 0 10px #00ff64; 
            animation: blink 1.2s infinite; 
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .desc { font-size: 1rem; color: #ccc; line-height: 1.5; margin-bottom: 30px; }

        /* الزر الرئيسي مع تأثير النبض */
        .btn-main {
            display: block; 
            background: linear-gradient(90deg, var(--dark-red), var(--red));
            color: white; 
            text-decoration: none; 
            padding: 18px;
            border-radius: 18px; 
            font-weight: 800; 
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .btn-main:active { transform: scale(0.96); }

        .footer { 
            margin-top: 25px; 
            font-size: 0.7rem; 
            color: #666; 
            font-weight: bold;
            text-transform: uppercase;
        }

        .footer span { color: var(--red); }
    </style>
</head>
<body>

    <div class="audio-toggle" onclick="toggleAudio()">
        <div class="speaker-box">
            <div class="speaker-body"></div>
            <div class="speaker-head"></div>
            <div class="mute-line" id="muteLine"></div>
        </div>
    </div>

    <div class="video-container">
        <video id="bgVideo" autoplay loop playsinline muted>
            <source src="https://cdn.discordapp.com/attachments/1276070423234351187/1503730018851753984/snapvideo--Goat.__Legend_of_Northern_Blade_manhwaedit_manhwa_legendofnorthernblade_fyp_lamun77_-.mov?ex=6a046936&is=6a0317b6&hm=68aaf06cf6e505b87af955e01af7aa1bc7a8e80181075dbceca89aac95efe023&" type="video/quicktime">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="glass-card">
        <h1 class="title">DELTA</h1>
        
        <div class="status-badge">
            <span class="dot"></span>
            IPA V2.720 | ONLINE
        </div>

        <p class="desc">استمتع بتشغيل سكريبتاتك المفضلة بأعلى استقرار وأداء على أجهزة الـ iOS</p>
        
        <a href="https://github.com/mohanad9539229-boop/AIMBOT-DEAD-RAILS/releases/download/v2.720/Delta-2.720.1164.ipa" class="btn-main">DOWNLOAD IPA</a>
        
        <p class="footer">🗡️ NORTHERN BLADE IS THE <span>GOAT</span></p>
    </div>

    <script>
        function toggleAudio() {
            var video = document.getElementById("bgVideo");
            var muteLine = document.getElementById("muteLine");
            if (video.muted) {
                video.muted = false;
                muteLine.style.opacity = "0";
            } else {
                video.muted = true;
                muteLine.style.opacity = "1";
            }
        }
    </script>

</body>
</html>
