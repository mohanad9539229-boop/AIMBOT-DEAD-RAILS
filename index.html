<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta Northern Blade | SLAX</title>
    <style>
        :root {
            --red: #ff0000;
            --dark-red: #8b0000;
            --glass: rgba(15, 15, 15, 0.85);
            --border: rgba(255, 0, 0, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: white;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* حاوية الفيديو */
        .video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        /* تصميم البطاقة الزجاجية */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 40px; padding: 45px 25px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 0, 0, 0.1);
        }

        .title {
            font-size: 2.8rem; font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--red));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* النقطة الخضراء الاحترافية */
        .status-badge {
            display: inline-flex; align-items: center;
            background: rgba(0, 255, 100, 0.1);
            color: #00ff64; padding: 6px 16px;
            border-radius: 50px; font-size: 0.85rem;
            margin: 20px 0; border: 1px solid rgba(0, 255, 100, 0.2);
        }

        .dot { height: 10px; width: 10px; background: #00ff64; border-radius: 50%; margin-left: 10px; box-shadow: 0 0 12px #00ff64; animation: blink 1.5s infinite; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* تصميم الزر المحسن */
        .btn-main {
            display: block; background: linear-gradient(45deg, var(--dark-red), var(--red));
            color: white; text-decoration: none; padding: 20px;
            border-radius: 20px; font-weight: 900; font-size: 1.3rem;
            margin-top: 30px; transition: 0.4s;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
            text-transform: uppercase;
        }

        .btn-main:active { transform: scale(0.92); box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5); }

        /* أيقونة الصوت المبرمجة */
        .audio-toggle {
            position: fixed; top: 30px; right: 30px;
            width: 50px; height: 50px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
        }

        .speaker-icon {
            width: 20px; height: 15px; background: white; position: relative;
            clip-path: polygon(0% 30%, 40% 30%, 100% 0%, 100% 100%, 40% 70%, 0% 70%);
        }

        .mute-line {
            position: absolute; width: 30px; height: 2px; background: var(--red);
            transform: rotate(45deg); display: block;
        }

        .desc { margin-top: 15px; font-size: 1rem; color: #eee; line-height: 1.6; }
        
        .footer { margin-top: 25px; font-size: 0.75rem; color: var(--red); font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="audio-toggle" onclick="toggleAudio()">
        <div class="speaker-icon" id="speakerIcon">
            <div class="mute-line" id="muteLine"></div>
        </div>
    </div>

    <div class="video-container">
        <video id="bgVideo" autoplay loop playsinline muted>
            <source src="https://cdn.discordapp.com/attachments/1276070423234351187/1503730018851753984/snapvideo--Goat.__Legend_of_Northern_Blade_manhwaedit_manhwa_legendofnorthernblade_fyp_lamun77_-.mov?ex=6a046936&is=6a0317b6&hm=68aaf06cf6e505b87af955e01af7aa1bc7a8e80181075dbceca89aac95efe023&" type="video/quicktime">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="glass-card">
        <h1 class="title">DELTA</h1>
        
        <div class="status-badge">
            <span class="dot"></span>
            IPA V2.64 | ONLINE
        </div>

        <p class="desc">استمتع بتشغيل سكريبتاتك المفضلة بأعلى استقرار</p>
        
        <a href="رابط_الـ_IPA_هنا" class="btn-main">Download IPA</a>
        
        <p class="footer">NORTHERN BLADE IS THE GOAT 🗡️</p>
    </div>

    <script>
        function toggleAudio() {
            var video = document.getElementById("bgVideo");
            var muteLine = document.getElementById("muteLine");
            if (video.muted) {
                video.muted = false;
                muteLine.style.display = "none";
            } else {
                video.muted = true;
                muteLine.style.display = "block";
            }
        }
    </script>

</body>
</html>
