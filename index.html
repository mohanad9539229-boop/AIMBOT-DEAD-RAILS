<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta Northern Blade | SLAX</title>
    <style>
        :root {
            --red: #ff0000;
            --dark-red: #4a0000;
            --glass: rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: white;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* حاوية الفيديو */
        .video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* تصميم البطاقة */
        .card {
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 30px; padding: 40px 20px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 1);
        }

        .title {
            font-size: 2.5rem; font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--red));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-main {
            display: block; background: linear-gradient(45deg, var(--dark-red), var(--red));
            color: white; text-decoration: none; padding: 18px;
            border-radius: 15px; font-weight: bold; font-size: 1.2rem;
            margin-top: 25px; transition: 0.3s;
        }

        /* أزرار التحكم بالصوت */
        .audio-control {
            position: fixed; top: 20px; right: 20px;
            background: var(--glass); border: 1px solid var(--red);
            color: white; padding: 10px; border-radius: 50%;
            width: 50px; height: 50px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; font-size: 1.2rem;
        }

        .desc { margin-top: 15px; font-size: 1rem; color: #ccc; line-height: 1.5; }
        
        .footer { margin-top: 20px; font-size: 0.7rem; color: var(--red); letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="audio-control" onclick="toggleAudio()" id="audioBtn">🔇</div>

    <div class="video-container">
        <video id="bgVideo" autoplay loop playsinline muted>
            <source src="https://cdn.discordapp.com/attachments/1276070423234351187/1503730018851753984/snapvideo--Goat.__Legend_of_Northern_Blade_manhwaedit_manhwa_legendofnorthernblade_fyp_lamun77_-.mov?ex=6a046936&is=6a0317b6&hm=68aaf06cf6e505b87af955e01af7aa1bc7a8e80181075dbceca89aac95efe023&" type="video/quicktime">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="card">
        <h1 class="title">DELTA</h1>
        <p class="desc">استمتع بتشغيل سكريبتاتك المفضلة بأعلى استقرار</p>
        
        <a href="رابط_الـ_IPA_هنا" class="btn-main">Download IPA</a>
        
        <p class="footer">NORTHERN BLADE IS THE GOAT</p>
    </div>

    <script>
        function toggleAudio() {
            var video = document.getElementById("bgVideo");
            var btn = document.getElementById("audioBtn");
            if (video.muted) {
                video.muted = false;
                btn.innerHTML = "🔊";
            } else {
                video.muted = true;
                btn.innerHTML = "🔇";
            }
        }
    </script>

</body>
</html>
